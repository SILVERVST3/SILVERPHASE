name: Build SilverPhase VST3

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar (CMake + JUCE 8.0.4)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar (Release)
        run: cmake --build build --config Release --parallel

      - name: Enviar VST3
        uses: actions/upload-artifact@v4
        with:
          name: SilverPhase-VST3
          path: build/SilverPhase_artefacts/Release/VST3/
